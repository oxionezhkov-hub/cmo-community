name = "cmo-razbory"
main = "worker.js"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding = "KV"
id = "1d4173c9a3d54841a6a1b5bc4ee44729"

[triggers]
# 9:00 UTC = 12:00 МСК, каждый час пн и пт (scheduled() сам проверяет час === 9)
crons = ["0 9 * * 1,5"]

# Required secrets (set via `wrangler secret put <NAME>`, never committed here):
#   BOT_TOKEN               - Telegram bot token
#   ADMIN_ID                - Telegram chat id for admin notifications
#   PAYMENTS_WEBHOOK_SECRET  - shared secret for POST /api/payments/webhook (edsofa.ai reconciliation)
#   CLAUDE_API                - Claude API key (квизы и вопросы к ИИ на /dashboard)
# Optional vars:
#   DASHBOARD_AI_MODEL        - модель для вопросов к дашборду (по умолчанию claude-haiku-4-5-20251001)
